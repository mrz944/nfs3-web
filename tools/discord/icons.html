<!doctype html>
<!-- The Discord server icon and the bot's avatar (own artwork, the sites' fonts), 512x512.
     ?icon=server -> server-icon.png, ?icon=bot -> bot-avatar.png (setup.mjs uploads them). To
     redraw: serve the repository root over http (the fonts are in web/fonts) and screenshot the
     page at 512x512, e.g. chrome --headless --window-size=512,512 --screenshot=server-icon.png URL.
     Discord shows both as circles, down to 32 px: what matters sits inside the circle, and is bold. -->
<meta charset="utf-8">
<meta name="viewport" content="width=512">
<style>
  @font-face { font-family: "Russo One"; src: url("../../web/fonts/russo-one-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Silkscreen"; font-weight: 700; src: url("../../web/fonts/silkscreen-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  svg { display: block; width: 512px; height: 512px; }
  svg:not(.on):not(#defs) { display: none; }
</style>

<svg id="defs" width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#2048d0" /><stop offset=".42" stop-color="#0a2088" /><stop offset=".78" stop-color="#040c44" /><stop offset="1" stop-color="#01031a" />
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" /><stop offset=".44" stop-color="#d6e4ff" /><stop offset=".5" stop-color="#4a68c8" />
      <stop offset=".58" stop-color="#9fb8ff" /><stop offset="1" stop-color="#f4f8ff" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6b0" /><stop offset=".45" stop-color="#ffd800" /><stop offset="1" stop-color="#e88800" />
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd800" stop-opacity="0" /><stop offset=".25" stop-color="#ffd800" /><stop offset=".8" stop-color="#ffb000" /><stop offset="1" stop-color="#ff9c00" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>

<svg id="server" viewBox="0 0 512 512"></svg>
<svg id="bot" viewBox="0 0 512 512"></svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const add = (parent, tag, attrs, text) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text) e.textContent = text;
  parent.append(e); return e;
};
// the dial both share: background, a rim, and rev-counter ticks in the games' colours
// (amber NFS II, gold NFS III, aqua NFS4) running into a red line
function dial(svg) {
  add(svg, 'rect', { width: 512, height: 512, fill: 'url(#bg)' });
  add(svg, 'circle', { cx: 256, cy: 256, r: 236, fill: 'none', stroke: '#5a7ee8', 'stroke-width': 6, opacity: .55 });
  add(svg, 'circle', { cx: 256, cy: 256, r: 226, fill: 'none', stroke: '#000418', 'stroke-width': 4, opacity: .7 });
  const colors = ['#e8a032', '#e8a032', '#e8a032', '#e8a032', '#ffd800', '#ffd800', '#ffd800', '#ffd800', '#3ef2d0', '#3ef2d0', '#3ef2d0', '#3ef2d0', '#ff4a3d', '#ff4a3d', '#ff4a3d'];
  const from = 145, to = 395, n = colors.length;
  for (let i = 0; i < n; i++) {
    const a = (from + (to - from) * i / (n - 1)) * Math.PI / 180;
    const big = i % 2 === 0, r1 = 208, r2 = big ? 176 : 188;
    add(svg, 'line', { x1: 256 + r1 * Math.cos(a), y1: 256 + r1 * Math.sin(a), x2: 256 + r2 * Math.cos(a), y2: 256 + r2 * Math.sin(a),
      stroke: colors[i], 'stroke-width': big ? 16 : 10, 'stroke-linecap': 'square' });
  }
}

function server(svg) {
  dial(svg);
  // gold swoosh, as under the NFS III logo
  add(svg, 'path', { d: 'M 70 330 Q 256 268 450 300 Q 256 290 70 342 Z', fill: 'url(#swoosh)' });
  const g = add(svg, 'g', { transform: 'translate(256 262) skewX(-12)' });
  add(g, 'text', { x: 6, y: 8, 'text-anchor': 'middle', 'font-family': 'Russo One', 'font-size': 150, fill: '#000418', opacity: .8 }, 'NFS');
  add(g, 'text', { x: 0, y: 0, 'text-anchor': 'middle', 'font-family': 'Russo One', 'font-size': 150, fill: 'url(#chrome)',
    stroke: '#000418', 'stroke-width': 8, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, 'NFS');
  add(svg, 'text', { x: 256, y: 384, 'text-anchor': 'middle', 'font-family': 'Silkscreen', 'font-weight': 700, 'font-size': 40, 'letter-spacing': 2,
    fill: 'url(#gold)', stroke: '#2a1000', 'stroke-width': 8, 'paint-order': 'stroke' }, 'CLASSICS');
}

function bot(svg) {
  dial(svg);
  // a chequered flag and a wrench, crossed
  const pair = add(svg, 'g', { transform: 'translate(256 256) scale(.78) translate(-256 -270)' });
  const flag = add(pair, 'g', { transform: 'translate(256 270) rotate(-36)' });
  add(flag, 'rect', { x: -9, y: -175, width: 18, height: 330, rx: 6, fill: '#d6e4ff', stroke: '#000418', 'stroke-width': 6 });
  const cloth = add(flag, 'g', { transform: 'translate(-170 -172)' });
  add(cloth, 'rect', { x: -4, y: -4, width: 168, height: 128, fill: '#000418' });
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++)
    add(cloth, 'rect', { x: c * 32, y: r * 30, width: 32, height: 30, fill: (r + c) % 2 ? '#0a1440' : '#f4f8ff' });
  const w = add(pair, 'g', { transform: 'translate(256 286) rotate(36)' });
  // handle and round head, with the open jaw cut out by a mask
  const m = add(w, 'mask', { id: 'jaw', maskUnits: 'userSpaceOnUse', x: -200, y: -300, width: 400, height: 600 });
  add(m, 'rect', { x: -200, y: -300, width: 400, height: 600, fill: '#fff' });
  add(m, 'path', { d: 'M -24 -230 L 24 -230 L 24 -150 Q 0 -128 -24 -150 Z', fill: '#000' });
  const wrench = 'M -24 -96 L -24 140 Q -24 166 0 166 Q 24 166 24 140 L 24 -96 A 72 72 0 1 0 -24 -96 Z';
  const body = add(w, 'g', { mask: 'url(#jaw)' });
  add(body, 'path', { d: wrench, fill: '#2a1000', stroke: '#2a1000', 'stroke-width': 20, 'stroke-linejoin': 'round' });
  add(body, 'path', { d: wrench, fill: 'url(#gold)' });
  add(w, 'circle', { cx: 0, cy: 128, r: 10, fill: '#2a1000' });
}

const which = new URLSearchParams(location.search).get('icon') || 'server';
server(document.getElementById('server'));
bot(document.getElementById('bot'));
document.getElementById(which).classList.add('on');
document.fonts.ready.then(() => { document.title = 'ready'; });
</script>
